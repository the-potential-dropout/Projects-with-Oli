name: Robot Sim

on:
  push:
    branches: [main]
    paths: ['robot-sim/**', '.github/workflows/robot-sim.yml']
  pull_request:
    paths: ['robot-sim/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: robot-sim

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust unit tests (IK, gait, physics)
        run: cargo test --manifest-path core/Cargo.toml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: robot-sim/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile the design notebook (published as notebook.html)
        run: python docs/notebook/build_notebook.py
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: robot-sim/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test-core, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
