[package]
name = "robot_core"
version = "0.1.0"
edition = "2021"
description = "Fast simulation core (leg IK, gait, projectile physics, ray casts) for the Robot Sim, compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
